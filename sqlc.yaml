version: "2"
sql:
  - engine: "sqlite"
    schema: "database/migrations/"
    queries: "database/queries/"
    gen:
      go:
        package: "db"
        out: "database/db"

        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_prepared_queries: true
        emit_pointers_for_null_types: true
        omit_unused_structs: false

        overrides:
          - column: "users.password_hash"
            go_struct_tag: "json:\"-\""
            
          - column: "*.created_at"
            go_type: "time.Time"
            
          - column: "*.updated_at"
            go_type: "time.Time"
            
          - column: "*.last_login"
            nullable: true
            go_type:
              pointer: true 
              type: "time.Time"
            
          - column: "*.deleted_at"
            nullable: true
            go_type:
              pointer: true 
              type: "time.Time"
            
          - column: "*.expires_at"
            go_type: "time.Time"
            
          - column: "users.id"
            go_type:
              import: "uuid"
              type: "UUID"
            
          - column: "sessions.id"
            go_type:
              import: "uuid"
              type: "UUID"
            
          - column: "sessions.user_id"
            go_type:
              import: "uuid"
              type: "UUID"
